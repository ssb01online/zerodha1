[project]
name = "portfolio"
version = "0.1.0"
description = "Portfolio samples, snapshots, and UI for Kite Connect holdings/positions"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1.0",
    "kitetools",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
kitetools = { workspace = true }
